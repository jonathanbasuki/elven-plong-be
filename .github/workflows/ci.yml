name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql+asyncpg://plong_elven:ci-password@127.0.0.1:5432/plong_elven
      JWT_SECRET: ci-only-secret
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - run: uv python install 3.12
      - run: uv sync --locked --group api --group dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest
