[project]
name = "plong-elven"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Elven - Lucky 7", email = "" }
]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.1",
]

[project.scripts]
plong-elven = "plong_elven:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
api = [
    "aioapns>=4.0",
    "alembic>=1.20.1",
    "argon2-cffi>=25.1.0",
    "asyncpg>=0.32.0",
    "email-validator>=2.3.0",
    "fastapi>=0.159.1",
    "pyjwt>=2.15.1",
    "python-multipart>=0.0.32",
    "sqlalchemy[asyncio]>=2.1.6",
    "uvicorn[standard]>=0.54.0",
]
dev = [
    "httpx>=0.28.1",
    "pre-commit>=4.7.0",
    "psutil>=7.2.2",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.1",
]
cctv = [
    "httpx>=0.28.1",
    "numpy>=2.3",
    "opencv-python>=5.0.0.93",
    "supervision>=0.31.1",
    "ultralytics>=8.4.183",
]
